name: weekly-build
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC, after the DACH index refresh (Mondays 06:00 Europe/Berlin, ~30 min)
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch the DACH Jobs API index (public, no token)
        run: python3 fetch.py --index
      - name: Weekly facts (input for the AI analysis)
        run: python3 weekly_facts.py
      - name: AI weekly analysis (skipped without ANTHROPIC_API_KEY; fact-checked, not published if the check fails)
        continue-on-error: true
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          pip install -q anthropic
          python3 write_article.py
      - name: Build site (+ weekly snapshot)
        run: python3 build.py --snapshot
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/weekly content/analysen
          git commit -m "Weekly snapshot + analysis $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    # Publishing stays off until the Impressum is filled in: set repo variable DEPLOY=true (Settings → Variables).
    if: vars.DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        run: python3 indexnow.py
