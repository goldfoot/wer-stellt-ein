name: weekly-build
on:
  # Mondays after the DACH index refresh (05:00 UTC, ~20 min). GitHub starts scheduled runs late under load, worst on the full
  # hour (16.11: +9.5 h, 23.11: +12 h), so there are several off-peak start times. Extra runs are harmless: the article and the
  # snapshot of a data date are written once (write_article.py skips an existing week; the snapshot file is overwritten unchanged).
  schedule:
    - cron: "41 5 * * 1"
    - cron: "13 6 * * 1"
    - cron: "47 6 * * 1"
    - cron: "29 8 * * 1"
  workflow_dispatch:
    inputs:
      ping: { description: "Only test the Anthropic API connection (no article)", type: boolean, default: false }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch the DACH Jobs API index (public, no token)
        run: python3 fetch.py --index
      - name: Weekly facts (input for the AI analysis)
        run: python3 weekly_facts.py
      # Anthropic via workload identity federation: no stored API key. GitHub's short-lived OIDC token is exchanged by the
      # SDK; the federation rule only accepts this repository on refs/heads/main. IDs are stored as secrets (owner's choice;
      # they are not credentials). Skipped while they are missing; the article is fact-checked and not published if the check fails.
      - name: AI weekly analysis (Claude via workload identity federation)
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
        run: |
          if [ -z "$ANTHROPIC_FEDERATION_RULE_ID" ]; then echo "federation not configured: skipping article"; exit 0; fi
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          pip install -q --upgrade anthropic
          python3 write_article.py ${{ inputs.ping && '--ping' || '' }}
      - name: Build site (+ weekly snapshot)
        run: python3 build.py --snapshot
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/weekly content/analysen
          git commit -m "Weekly snapshot + analysis $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    # Publishing stays off until the Impressum is filled in: set repo variable DEPLOY=true (Settings → Variables).
    if: vars.DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        run: python3 indexnow.py
